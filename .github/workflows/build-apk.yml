name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {} # permite tocar "Run workflow" a mano desde GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Instalar dependencias
        run: flutter pub get

      - name: Generar carpetas nativas (android/ios/etc)
        run: flutter create . --platforms=android --project-name hortalizas_pos

      - name: Subir minSdkVersion a 23 (lo pide firebase_auth)
        run: |
          sed -i 's/minSdkVersion[[:space:]]*flutter\.minSdkVersion/minSdkVersion 23/' android/app/build.gradle
          grep -n "minSdkVersion" android/app/build.gradle

      - name: Compilar APK
        run: flutter build apk --release

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: hortalizas-pos-apk
          path: build/app/outputs/flutter-apk/app-release.apk