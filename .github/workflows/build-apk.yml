name: Compilar APK y programa de Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Generar carpetas nativas (android/ios/etc)
        run: flutter create . --platforms=android --project-name hortalizas_pos

      - name: Instalar dependencias (con reintentos por si falla la red)
        run: |
          for intento in 1 2 3; do
            echo "=== Intento $intento de flutter pub get ==="
            flutter pub get && break
            if [ "$intento" = "3" ]; then
              echo "ERROR: flutter pub get falló 3 veces seguidas"
              exit 1
            fi
            echo "Reintentando en 10 segundos..."
            sleep 10
          done

      - name: Verificar que sqflite_common_ffi se haya descargado
        run: |
          RUTA="$HOME/.pub-cache/hosted/pub.dev"
          echo "--- Paquetes sqflite en cache ---"
          ls "$RUTA" | grep sqflite || echo "(ninguno encontrado)"
          if ! ls "$RUTA" | grep -q "sqflite_common_ffi-"; then
            echo "ERROR: sqflite_common_ffi no está en el pub cache tras pub get"
            exit 1
          fi

      - name: Subir minSdkVersion a 23 (lo pide firebase_auth)
        run: |
          echo "--- build.gradle ANTES del cambio ---"
          grep -n "minSdkVersion" android/app/build.gradle
          sed -i '/minSdkVersion/s/.*/        minSdkVersion 23/' android/app/build.gradle
          echo "--- build.gradle DESPUES del cambio ---"
          grep -n "minSdkVersion" android/app/build.gradle
          if ! grep -q "minSdkVersion 23" android/app/build.gradle; then
            echo "ERROR: no se pudo fijar minSdkVersion en 23"
            exit 1
          fi

      - name: Compilar APK
        run: flutter build apk --release

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: hortalizas-pos-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generar carpetas nativas (windows)
        run: flutter create . --platforms=windows --project-name hortalizas_pos

      - name: Instalar dependencias (con reintentos por si falla la red)
        run: |
          $exito = $false
          for ($intento = 1; $intento -le 3; $intento++) {
            Write-Host "=== Intento $intento de flutter pub get ==="
            flutter pub get
            if ($LASTEXITCODE -eq 0) { $exito = $true; break }
            Write-Host "Reintentando en 10 segundos..."
            Start-Sleep -Seconds 10
          }
          if (-not $exito) {
            Write-Host "ERROR: flutter pub get falló 3 veces seguidas"
            exit 1
          }
        shell: pwsh

      - name: Habilitar soporte de escritorio Windows
        run: flutter config --enable-windows-desktop

      - name: Compilar programa de Windows
        run: flutter build windows --release
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"

      - name: Comprimir el programa compilado en un zip
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath hortalizas-pos-windows.zip
        shell: pwsh

      - name: Subir programa de Windows como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: hortalizas-pos-windows
          path: hortalizas-pos-windows.zip
