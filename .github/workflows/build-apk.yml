name: Compilar APK y programa de Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Generar carpetas nativas (android/ios/etc)
        run: flutter create . --platforms=android --project-name hortalizas_pos

      - name: Instalar dependencias (con reintentos por si falla la red)
        run: |
          for intento in 1 2 3; do
            echo "=== Intento $intento de flutter pub get ==="
            flutter pub get && break
            if [ "$intento" = "3" ]; then
              echo "ERROR: flutter pub get falló 3 veces seguidas"
              exit 1
            fi
            echo "Reintentando en 10 segundos..."
            sleep 10
          done

      - name: Subir minSdkVersion a 23 (lo pide firebase_auth)
        run: |
          sed -i '/minSdkVersion/s/.*/        minSdkVersion 23/' android/app/build.gradle

      - name: Compilar APK
        id: build_apk
        run: flutter build apk --release --verbose 2>&1 | tee /tmp/android_build.log
        continue-on-error: true

      - name: Guardar log de error para diagnostico (si falló)
        if: steps.build_apk.outcome == 'failure'
        run: |
          pip install --quiet requests 2>/dev/null || true
          python3 - <<'PYEOF'
import base64, json, os, urllib.request

token = os.environ['GH_TOKEN']
repo = os.environ['GITHUB_REPOSITORY']

with open('/tmp/android_build.log', 'rb') as f:
    content = f.read()
content = content[-90000:]  # últimos ~90kb, suficiente para ver el error
b64 = base64.b64encode(content).decode()

url = f'https://api.github.com/repos/{repo}/contents/android-error.txt'
headers = {'Authorization': f'token {token}', 'Accept': 'application/vnd.github+json'}

sha = None
try:
    req = urllib.request.Request(url + '?ref=ci-logs', headers=headers)
    with urllib.request.urlopen(req) as resp:
        sha = json.load(resp)['sha']
except Exception:
    pass

payload = {
    'message': 'ci: log de error de build android',
    'content': b64,
    'branch': 'ci-logs',
}
if sha:
    payload['sha'] = sha

req2 = urllib.request.Request(
    url, data=json.dumps(payload).encode(), method='PUT',
    headers={**headers, 'Content-Type': 'application/json'},
)
with urllib.request.urlopen(req2) as resp:
    print('Log guardado, status:', resp.status)
PYEOF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fallar el job si la compilacion fallo
        if: steps.build_apk.outcome == 'failure'
        run: exit 1

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: hortalizas-pos-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    runs-on: windows-latest
    env:
      PUB_CACHE: ${{ github.workspace }}\.pub-cache
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generar carpetas nativas (windows)
        run: flutter create . --platforms=windows --project-name hortalizas_pos

      - name: Instalar dependencias (con reintentos por si falla la red)
        run: |
          $exito = $false
          for ($intento = 1; $intento -le 3; $intento++) {
            Write-Host "=== Intento $intento de flutter pub get ==="
            flutter pub get
            if ($LASTEXITCODE -eq 0) { $exito = $true; break }
            Start-Sleep -Seconds 10
          }
          if (-not $exito) { exit 1 }
        shell: pwsh

      - name: Habilitar soporte de escritorio Windows
        run: flutter config --enable-windows-desktop

      - name: Compilar programa de Windows
        id: build_windows
        run: flutter build windows --release --verbose 2>&1 | Tee-Object -FilePath build_windows.log
        shell: pwsh
        continue-on-error: true
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"

      - name: Guardar log de error para diagnostico (si falló)
        if: steps.build_windows.outcome == 'failure'
        shell: pwsh
        run: |
          python -c "
import base64, json, os, urllib.request

token = os.environ['GH_TOKEN']
repo = os.environ['GITHUB_REPOSITORY']

with open('build_windows.log', 'rb') as f:
    content = f.read()
content = content[-90000:]
b64 = base64.b64encode(content).decode()

url = f'https://api.github.com/repos/{repo}/contents/windows-error.txt'
headers = {'Authorization': f'token {token}', 'Accept': 'application/vnd.github+json'}

sha = None
try:
    req = urllib.request.Request(url + '?ref=ci-logs', headers=headers)
    with urllib.request.urlopen(req) as resp:
        sha = json.load(resp)['sha']
except Exception:
    pass

payload = {
    'message': 'ci: log de error de build windows',
    'content': b64,
    'branch': 'ci-logs',
}
if sha:
    payload['sha'] = sha

req2 = urllib.request.Request(
    url, data=json.dumps(payload).encode(), method='PUT',
    headers={**headers, 'Content-Type': 'application/json'},
)
with urllib.request.urlopen(req2) as resp:
    print('Log guardado, status:', resp.status)
"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fallar el job si la compilacion fallo
        if: steps.build_windows.outcome == 'failure'
        shell: pwsh
        run: exit 1

      - name: Comprimir el programa compilado en un zip
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath hortalizas-pos-windows.zip
        shell: pwsh

      - name: Subir programa de Windows como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: hortalizas-pos-windows
          path: hortalizas-pos-windows.zip
