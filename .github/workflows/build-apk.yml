name: Compilar APK y programa de Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  verificar-firebase-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que el secreto existe y es una clave valida
        run: |
          if [ -z "$FIREBASE_KEY" ]; then
            echo "FALTA el secreto FIREBASE_SERVICE_ACCOUNT_JSON (esta vacio o no existe)."
            exit 1
          fi
          echo "$FIREBASE_KEY" > /tmp/sa.json
          python3 -c "
import json
with open('/tmp/sa.json') as f:
    data = json.load(f)
campos_esperados = ['type', 'project_id', 'private_key', 'client_email']
faltantes = [c for c in campos_esperados if c not in data]
if faltantes:
    print('El JSON no tiene los campos esperados:', faltantes)
    exit(1)
print('JSON con formato correcto.')
print('project_id:', data['project_id'])
print('client_email:', data['client_email'])
"
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Probar conexion real contra Firestore
        run: |
          pip install --quiet google-auth google-cloud-firestore --break-system-packages
          python3 -c "
from google.cloud import firestore
db = firestore.Client.from_service_account_json('/tmp/sa.json')
# Una lectura minima y segura: solo lista los NOMBRES de las colecciones
# que ya existen, no lee ningun documento ni dato real.
colecciones = [c.id for c in db.collections()]
print('Conexion exitosa. Colecciones encontradas:', colecciones)
"
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

  build-android:
    runs-on: ubuntu-latest
    env:
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generar carpetas nativas (android/ios/etc)
        id: create_android
        run: flutter create . --platforms=android --project-name hortalizas_pos 2>&1 | tee /tmp/create_android.log
        continue-on-error: true

      - name: Guardar log si fallo flutter create (android)
        if: steps.create_android.outcome == 'failure'
        run: python3 .github/scripts/upload_log.py create-android-error.txt /tmp/create_android.log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fallar el job si flutter create fallo (android)
        if: steps.create_android.outcome == 'failure'
        run: exit 1

      - name: Instalar dependencias (con reintentos por si falla la red)
        id: pub_get_android
        run: |
          for intento in 1 2 3; do
            echo "=== Intento $intento de flutter pub get ==="
            flutter pub get 2>&1 | tee /tmp/pubget_android.log && break
            if [ "$intento" = "3" ]; then
              exit 1
            fi
            sleep 10
          done
        continue-on-error: true

      - name: Guardar log si fallo pub get (android)
        if: steps.pub_get_android.outcome == 'failure'
        run: python3 .github/scripts/upload_log.py pubget-android-error.txt /tmp/pubget_android.log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fallar el job si pub get fallo (android)
        if: steps.pub_get_android.outcome == 'failure'
        run: exit 1

      - name: Ajustar minSdk y compileSdk (lo piden varios plugins)
        run: |
          set +e
          echo "--- Archivos build.gradle encontrados ---" > /tmp/minsdk.log
          find android/app -maxdepth 1 -name "build.gradle*" >> /tmp/minsdk.log
          ARCHIVO=$(find android/app -maxdepth 1 -name "build.gradle*" | head -1)
          echo "Usando archivo: $ARCHIVO" >> /tmp/minsdk.log
          if [ -n "$ARCHIVO" ]; then
            echo "--- Contenido ANTES ---" >> /tmp/minsdk.log
            cat "$ARCHIVO" >> /tmp/minsdk.log
            sed -i -E 's/^([[:space:]]*minSdk(Version)?[[:space:]]*=?[[:space:]]*).*/\1 23/' "$ARCHIVO"
            sed -i -E 's/^([[:space:]]*compileSdk(Version)?[[:space:]]*=?[[:space:]]*).*/\1 36/' "$ARCHIVO"
            echo "--- Contenido DESPUES ---" >> /tmp/minsdk.log
            cat "$ARCHIVO" >> /tmp/minsdk.log
          else
            echo "NO SE ENCONTRO NINGUN build.gradle*" >> /tmp/minsdk.log
          fi
          python3 .github/scripts/upload_log.py minsdk-diagnostico.txt /tmp/minsdk.log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compilar APK
        id: build_apk
        run: |
          set -o pipefail
          flutter build apk --release --verbose 2>&1 | tee /tmp/android_build.log
        continue-on-error: true

      - name: Guardar log de compilacion siempre (diagnostico)
        run: python3 .github/scripts/upload_log.py android-build-full.txt /tmp/android_build.log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar log de error para diagnostico (si fallo)
        if: steps.build_apk.outcome == 'failure'
        run: python3 .github/scripts/upload_log.py android-error.txt /tmp/android_build.log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fallar el job si la compilacion fallo
        if: steps.build_apk.outcome == 'failure'
        run: exit 1

      - name: Listar contenido real de la carpeta de salida (diagnostico)
        run: |
          echo "--- Buscando cualquier .apk en todo el proyecto ---" | tee /tmp/listado_outputs.log
          find . -iname "*.apk" 2>&1 | tee -a /tmp/listado_outputs.log
          echo "--- Contenido de build/ (si existe) ---" | tee -a /tmp/listado_outputs.log
          find build -maxdepth 4 2>&1 | tee -a /tmp/listado_outputs.log
          echo "--- Contenido de android/app/build/ (si existe) ---" | tee -a /tmp/listado_outputs.log
          find android/app/build -maxdepth 4 2>&1 | tee -a /tmp/listado_outputs.log

      - name: Guardar listado de diagnostico
        run: python3 .github/scripts/upload_log.py listado-outputs-android.txt /tmp/listado_outputs.log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: hortalizas-pos-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publicar APK en una Release (link de descarga estable)
        run: python3 .github/scripts/publish_release.py ultima-compilacion build/app/outputs/flutter-apk/app-release.apk hortalizas-pos.apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    env:
      PUB_CACHE: ${{ github.workspace }}\.pub-cache
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: 'stable'

      - name: Generar carpetas nativas (windows)
        id: create_windows
        run: flutter create . --platforms=windows --project-name hortalizas_pos 2>&1 | Tee-Object -FilePath create_windows.log
        shell: pwsh
        continue-on-error: true

      - name: Guardar log si fallo flutter create (windows)
        if: steps.create_windows.outcome == 'failure'
        shell: pwsh
        run: python .github/scripts/upload_log.py create-windows-error.txt create_windows.log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fallar el job si flutter create fallo (windows)
        if: steps.create_windows.outcome == 'failure'
        shell: pwsh
        run: exit 1

      - name: Instalar dependencias (con reintentos por si falla la red)
        run: |
          $exito = $false
          for ($intento = 1; $intento -le 3; $intento++) {
            flutter pub get
            if ($LASTEXITCODE -eq 0) { $exito = $true; break }
            Start-Sleep -Seconds 10
          }
          if (-not $exito) { exit 1 }
        shell: pwsh

      - name: Habilitar soporte de escritorio Windows
        run: flutter config --enable-windows-desktop

      - name: Precachear artefactos de Windows
        run: flutter precache --windows

      - name: Reinstalar dependencias justo antes de compilar (ultima sincronizacion)
        run: flutter pub get
        shell: pwsh

      - name: Verificar fisicamente si el archivo existe en el disco
        shell: pwsh
        run: |
          "--- Contenido de lib/ de sqlite3 (version resuelta) ---" | Tee-Object -FilePath verificacion.log
          $sqlite3dir = Get-ChildItem "$env:PUB_CACHE\hosted\pub.dev" -Directory | Where-Object { $_.Name -like "sqlite3-*" }
          foreach ($d in $sqlite3dir) {
            "Carpeta: $($d.FullName)" | Tee-Object -FilePath verificacion.log -Append
            Get-ChildItem "$($d.FullName)\lib" -Recurse -File | ForEach-Object { $_.FullName | Tee-Object -FilePath verificacion.log -Append }
          }
          python .github/scripts/upload_log.py verificacion-windows.txt verificacion.log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compilar programa de Windows
        id: build_windows
        run: flutter build windows --release --verbose 2>&1 | Tee-Object -FilePath build_windows.log
        shell: pwsh
        continue-on-error: true
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
          CL: "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"

      - name: Guardar log de error para diagnostico (si fallo)
        if: steps.build_windows.outcome == 'failure'
        shell: pwsh
        run: python .github/scripts/upload_log.py windows-error.txt build_windows.log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fallar el job si la compilacion fallo
        if: steps.build_windows.outcome == 'failure'
        shell: pwsh
        run: exit 1

      - name: Comprimir el programa compilado en un zip
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath hortalizas-pos-windows.zip
        shell: pwsh

      - name: Subir programa de Windows como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: hortalizas-pos-windows
          path: hortalizas-pos-windows.zip

      - name: Publicar programa de Windows en una Release (link de descarga estable)
        run: python .github/scripts/publish_release.py ultima-compilacion hortalizas-pos-windows.zip hortalizas-pos-windows.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
