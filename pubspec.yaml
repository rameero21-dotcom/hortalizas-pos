name: hortalizas_pos
description: "Sistema POS para comercio mayorista/minorista de hortalizas - Vendedor, Caja y Administrador sincronizados."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Manejo de estado
  flutter_riverpod: ^2.5.1

  # Firebase
  firebase_core: ^3.1.0
  cloud_firestore: ^5.0.1
  firebase_auth: ^5.1.0

  # Base de datos local
  sqflite: ^2.3.3
  sqflite_common_ffi: 2.3.0 # version anterior, para evitar el mecanismo experimental de "native assets" de Dart
  path: ^1.9.0
  path_provider: ^2.1.3

  # Conectividad y sincronización
  connectivity_plus: ^6.0.3

  # QR
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # Impresión térmica (58mm / 80mm, Bluetooth/USB)
  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.1.5

  # Gráficos para estadísticas
  fl_chart: ^0.68.0

  # Exportación
  pdf: ^3.11.0
  printing: ^5.13.1
  excel: ^4.0.3
  share_plus: ^9.0.0

  # Utilidades
  intl: ^0.19.0
  uuid: ^4.4.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_local_notifications: ^17.1.2

  # UI / UX
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  vibration: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
    - assets/icons/
